# Application Config
spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Datasource Config
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ratocego}
spring.datasource.username=${DATABASE_USERNAME:ratocego}
spring.datasource.password=${DATABASE_PASSWORD:ratocego}

# Spring data Config
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# MQTT Configuration
app.mqtt.server-uri=${MQTT_SERVER_URI:tcp://localhost:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:ratocego-backend}
app.mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:ratocego}
app.mqtt.username=${MQTT_USERNAME:ratocego}
app.mqtt.password=${MQTT_PASSWORD}
app.mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
app.mqtt.keep-alive-seconds=${MQTT_KEEP_ALIVE_SECONDS:10}
app.mqtt.automatic-reconnect=${MQTT_AUTOMATIC_RECONNECT:true}
app.mqtt.qos=${MQTT_QOS:1}
app.mqtt.outbound-client-id=${MQTT_OUTBOUND_CLIENT_ID:ratocego-backend-out}
app.mqtt.publish-completion-timeout-ms=${MQTT_PUBLISH_COMPLETION_TIMEOUT_MS:5000}

# Battery Config
app.battery.critical-voltage-volts=${BATTERY_CRITICAL_VOLTAGE_VOLTS:6.6}
app.battery.recovery-voltage-volts=${BATTERY_RECOVERY_VOLTAGE_VOLTS:6.8}

# Health Check Config
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,mqttConnection
