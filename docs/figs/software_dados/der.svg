<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">DER — Rato Cego</title><desc id="desc">Mapeamento JPA de Run e TelemetrySample, incluindo as duas restrições únicas das amostras.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#111;font-size:18px}.title{font-size:28px;font-weight:bold}.entity{font-size:23px;font-weight:bold}.small{font-size:15px}.box,.rule,.edge{fill:none;stroke:#111;stroke-width:2}</style>
  <rect width="1200" height="900" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="title">DER — Rato Cego (mapeamento JPA)</text>
  <rect class="box" x="75" y="110" width="500" height="570"/><line class="rule" x1="75" y1="162" x2="575" y2="162"/><text x="325" y="145" text-anchor="middle" class="entity">RUNS</text>
  <text x="105" y="200">id: BIGINT [PK, SEQUENCE, runId]</text><text x="105" y="237">status: VARCHAR [NOT NULL]</text><text x="105" y="274">started_at: TIMESTAMP</text><text x="105" y="311">finished_at: TIMESTAMP</text><text x="105" y="348">maze_rows: INTEGER</text><text x="105" y="385">maze_columns: INTEGER</text><text x="105" y="422">challenge_completed: BOOLEAN</text><text x="105" y="459">distance_travelled_meters: DECIMAL</text><text x="105" y="496">average_speed_meters_per_second: DECIMAL</text><text x="105" y="533">charge_consumed_milliamp_hours: DECIMAL</text><text x="105" y="570">energy_consumed_watt_hours: DECIMAL</text><text x="105" y="607">battery_status: VARCHAR</text><text x="105" y="644" style="font-size:12px">last_sequence, last_sample_at, last_current_milli_amps, last_power_watts</text><text x="105" y="670" style="font-size:12px">start_requested_at, interrupt_requested_at, interrupt_timeout_warned</text>
  <rect class="box" x="655" y="110" width="475" height="570"/><line class="rule" x1="655" y1="162" x2="1130" y2="162"/><text x="892" y="145" text-anchor="middle" class="entity">TELEMETRY_SAMPLES</text>
  <text x="685" y="200">id: BIGINT [PK, IDENTITY]</text><text x="685" y="237">run_id: BIGINT [FK, NOT NULL]</text><text x="685" y="274">event_id: BIGINT [UNIQUE, NOT NULL]</text><text x="685" y="311">sequence_number: BIGINT [NOT NULL]</text><text x="685" y="348">recorded_at: TIMESTAMP [NOT NULL]</text><text x="685" y="385">position_row, position_column: INTEGER</text><text x="685" y="422">heading: VARCHAR</text><text x="685" y="459">distance_travelled_meters: DECIMAL</text><text x="685" y="496">current_speed_meters_per_second: DECIMAL</text><text x="685" y="533">battery_voltage_volts: DECIMAL</text><text x="685" y="570">current_milli_amps: DECIMAL</text><text x="685" y="607">current_power_watts: DECIMAL</text><text x="685" y="644">UNIQUE(run_id, sequence_number)</text>
  <path class="edge" d="M575 300 L655 300"/><text x="615" y="285" text-anchor="middle" class="small">1 : 0..*</text>
  <text x="75" y="745" class="small">As dimensões do labirinto são persistidas em RUNS; não há tabela de catálogo Maze.</text><text x="75" y="780" class="small">Os nomes físicos exibidos correspondem às colunas JPA; a duração é derivada dos timestamps.</text>
</svg>
